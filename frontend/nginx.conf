# Cấu hình nginx phục vụ SPA React + proxy /api tới backend.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Không để lộ phiên bản nginx.
  server_tokens off;

  # Header bảo mật (bổ sung cho helmet ở backend cho các phản hồi tĩnh).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Tài sản có hash trong tên → cache lâu; index.html không cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # API → backend. Tên service 'backend' do docker-compose/DNS phân giải.
  location /api/ {
    proxy_pass http://backend:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Tài liệu y tế có thể vài MB.
    client_max_body_size 25m;
  }

  # SPA fallback: mọi route khác trả index.html để React Router xử lý.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
